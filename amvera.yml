---
meta:
  environment: nodejs
  toolchain:
    name: npm
    version: 20
build:
  skip: false
  additionalCommands: npm run build
  artifacts:
    '*': /
run:
  persistenceMount: /data
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: npm run start -- --hostname 0.0.0.0 --port 3000
  containerPort: 3000
  singleton: true
  zeroDowntime: false
